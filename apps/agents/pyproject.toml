[project]
name = "crisisgrid-agents"
version = "0.1.0"
description = "CrisisGrid multi-agent crisis assessment service (Google ADK)"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.3.0",
    "mcp>=1.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[tool.setuptools]
packages = ["crisisgrid_agents"]
